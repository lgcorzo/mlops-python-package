name: Wiki Content Sync

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
  repository_dispatch:
    types: [docs]
  workflow_dispatch:
  gollum:

env:
  GIT_AUTHOR_NAME: GitHub Action
  GIT_AUTHOR_EMAIL: action@github.com
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-content-to-wiki:
    if: always() && format('refs/heads/{0}', github.event.repository.default_branch) == github.ref && github.event_name != 'gollum'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync repo wiki folder to wiki
        run: |
          WIKI_TOKEN="${{ secrets.WIKI_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"
          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          git clone "$WIKI_URL" wiki_temp
          
          find wiki_temp -mindepth 1 -maxdepth 1 -not -name ".git" -exec rm -rf {} +
          
          cp -r wiki/* wiki_temp/
          
          cd wiki_temp
          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git add .
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync documentation to wiki [skip ci]"
            git push origin HEAD:master || git push origin HEAD:main
          else
            echo "No changes to sync."
          fi
        shell: bash

  sync-wiki-to-repo:
    if: github.event_name == 'gollum'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify Wiki Directory
        id: safe
        run: |
          if [ -d "wiki" ]; then
            echo "Wiki directory found."
          else
            echo "wiki directory not found. Please sync to wiki first."
            exit 1
          fi
        shell: bash
      - name: Sync Wiki to Repo
        id: sync
        run: |
          WIKI_TOKEN="${{ secrets.WIKI_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"
          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          git clone "$WIKI_URL" wiki_temp
          
          SYNC_BRANCH="wiki-sync-$(date +%s)"
          git checkout -b "$SYNC_BRANCH"
          
          rm -rf wiki/*
          cp -r wiki_temp/* wiki/
          rm -rf wiki/.git
          
          rm -rf wiki_temp
          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git add wiki/
          
          if [ -n "$(git status --porcelain wiki/)" ]; then
             git commit -m "chore: sync wiki changes back to repository"
             git push origin "$SYNC_BRANCH"
             echo "branch_name=$SYNC_BRANCH" >> $GITHUB_OUTPUT
          else
             echo "No changes found."
             exit 0
          fi
        shell: bash
      - name: Create Pull Request
        if: steps.sync.outputs.branch_name != ''
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.sync.outputs.branch_name }}
          base: ${{ github.event.repository.default_branch }}
          title: "[Chore] - Syncing Wiki changes from Web UI into repository"
          body: ":crown: *An automated PR* This PR syncs changes made directly in the GitHub Wiki back to the repository's `wiki/` folder."
          labels: "wiki,automation"
          token: ${{ secrets.GITHUB_TOKEN }}
