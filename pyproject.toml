# https://python-poetry.org/docs/pyproject/

[project]
name = "regression_model_template"
version = "2.0.1"
description = "Predict the number of regression_model_template available."
authors = [{ name = "lgcorzo" }]
readme = "README.md"
license = "MIT"
keywords = ["mlops", "python", "package"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru (>=0.7.2,<0.8.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "mlflow (>=3.11.1,<4.0.0)",
    "numpy (>=1.26.4,<2.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "pandas (>=2.2.2,<3.0.0)",
    "pandera (>=0.20.1,<0.21.0)",
    "plotly (>=5.22.0,<6.0.0)",
    "plyer (>=2.1.0,<3.0.0)",
    "psutil (>=6.0.0,<7.0.0)",
    "pyarrow (>=17.0.0,<24.0.0)",
    "pydantic (>=2.7.4,<3.0.0)",
    "pydantic-settings (>=2.3.4,<3.0.0)",
    "pynvml (>=11.5.0,<12.0.0)",
    "setuptools (>=83.0.0,<90.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "shap (>=0.46.0,<0.47.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "mlserver (>=1.7.1,<2.0.0)",
    "mlserver-mlflow (>=1.7.1,<2.0.0)",
    "opentelemetry-instrumentation (>=0.51b0,<0.52)",
    "opentelemetry-exporter-otlp-proto-http (>=1.30.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.30.0,<2.0.0)",
    "confluent-kafka (>=2.8.2,<3.0.0)",
    "fastapi (>=0.124.0,<1.0.0)",
    "pyopenssl (>=26.0.0,<27.0.0)",
    "diskcache (>=5.6.3,<6.0.0)",
    "starlette (>=0.50.0,<1.0.0)",
    # explicitly define secure version for transitive dependency cryptography (April 2026 environment)
    "cryptography (>=46.0.6,<50.0.0)",
]

[project.scripts]
regression_model_template = "regression_model_template.scripts:main"

[tool.poetry]
packages = [{ include = "regression_model_template", from = "src" }]

[tool.poetry.group.checks.dependencies]
bandit = "^1.7.9"
coverage = "^7.5.4"
mypy = "^1.10.1"
pytest = "^9.0.3"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.6.1"
pandera = { extras = ["mypy"], version = "^0.20.1" }
ruff = "^0.9.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^1.3.0"

[tool.poetry.group.commits.dependencies]
commitizen = "^3.27.0"
pre-commit = "^3.7.1"

[tool.poetry.group.dev.dependencies]
invoke = "^2.2.0"
pip-audit = "^2.10.0"
safety = "^3.7.0"

[tool.poetry.group.docs.dependencies]
pdoc = "^14.5.1"

[tool.poetry.group.notebooks.dependencies]
ipykernel = "^6.29.4"
nbformat = "^5.10.4"

# CONFIGURATIONS

[tool.bandit]
targets = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "poetry"
changelog_start_rev = "v1.0.0"
update_changelog_on_bump = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.mypy]
pretty = true
strict = true
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pandera.mypy", "pydantic.mypy"]
exclude = []

[tool.pytest.ini_options]
addopts = "--verbosity=2"
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*predict.*not supported:UserWarning",
    "ignore:.*Add type hints to the .predict. method:UserWarning",
    "ignore:.*min_items.*is deprecated:DeprecationWarning",
    "ignore:.*np.inexact.*to a dtype is deprecated:DeprecationWarning",
]

[tool.ruff]
fix = true
indent-width = 4
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]

# SYSTEMS

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
